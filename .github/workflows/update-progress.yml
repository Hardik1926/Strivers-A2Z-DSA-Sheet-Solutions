name: Update DSA Progress

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate progress
        run: |
          cpp_count=$(find . -type f -name "*.cpp" | wc -l)
          java_count=$(find . -type f -name "*.java" | wc -l)

          # C++ files represent the questions in the sheet.
          # Java files represent the completed solutions.
          #
          # C++ contributes 50% of the overall progress.
          # Java contributes the other 50%.

          if [ "$cpp_count" -eq 0 ]; then
            cpp_progress=0
            java_progress=0
            overall_progress=0
          else
            # C++ is considered the complete question set.
            cpp_progress=50

            # Java progress represents the second 50%.
            java_progress=$((java_count * 50 / cpp_count))

            # Prevent progress from going above 50%.
            if [ "$java_progress" -gt 50 ]; then
              java_progress=50
            fi

            overall_progress=$((cpp_progress + java_progress))
          fi

          echo "C++ questions: $cpp_count"
          echo "Java solutions: $java_count"
          echo "C++ contribution: $cpp_progress%"
          echo "Java contribution: $java_progress%"
          echo "Overall progress: $overall_progress%"

          python3 - <<EOF
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text()

          start = "<!-- PROGRESS_START -->"
          end = "<!-- PROGRESS_END -->"

          cpp_count = $cpp_count
          java_count = $java_count
          cpp_progress = $cpp_progress
          java_progress = $java_progress
          overall_progress = $overall_progress

          filled = round(overall_progress / 5)
          empty = 20 - filled

          progress_bar = "█" * filled + "░" * empty

          progress_section = f"""<!-- PROGRESS_START -->

          | Language | Status | Progress |
          |:---:|:---|:---:|
          | ⚡ C++ | Questions | **{{cpp_progress}}%** |
          | ☕ Java | Solutions | **{{java_progress}}%** |
          | 🎯 Overall | Completion | **{{overall_progress}}%** |

          ### 📈 Overall Progress

          `{{progress_bar}}` **{{overall_progress}}%**

          **{{java_count}} / {{cpp_count}}** Java solutions completed

          <!-- PROGRESS_END -->"""

          start_index = text.index(start)
          end_index = text.index(end) + len(end)

          text = (
              text[:start_index]
              + progress_section
              + text[end_index:]
          )

          readme.write_text(text)
          EOF

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No progress changes."
          else
            git commit -m "Update DSA progress"
            git push
          fi