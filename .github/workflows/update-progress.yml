name: Update DSA Progress

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate progress
        run: |
          cpp_count=$(find . -type f -name "*.cpp" | wc -l)
          java_count=$(find . -type f -name "*.java" | wc -l)

          if [ "$cpp_count" -eq 0 ]; then
            progress=0
          else
            progress=$((java_count * 100 / cpp_count))
          fi

          echo "C++ questions: $cpp_count"
          echo "Java answers: $java_count"
          echo "Progress: $progress%"

          python3 - <<EOF
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text()

          start = "<!-- PROGRESS_START -->"
          end = "<!-- PROGRESS_END -->"

          progress_section = f"""<!-- PROGRESS_START -->

          | Language | Purpose | Count |
          |----------|---------|------:|
          | ☕ Java | Answers / Solutions | {java_count} |
          | ⚡ C++ | Questions | {cpp_count} |

          ### 🎯 Overall Progress

          **{progress}%**

          <progress value="{progress}" max="100"></progress>

          <!-- PROGRESS_END -->"""

          start_index = text.index(start)
          end_index = text.index(end) + len(end)

          text = text[:start_index] + progress_section + text[end_index:]

          readme.write_text(text)
          EOF

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No progress changes."
          else
            git commit -m "Update DSA progress"
            git push
          fi